<style>
  /* Pantalla de carga: evita el flash negro mientras bajan los scripts. */
  #boot{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(120% 90% at 50% 25%,#132140 0%,#0A0F1D 62%,#05080F 100%);color:#F5B942;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity .4s ease}
  #boot.is-out{opacity:0;pointer-events:none}
  #boot .b-title{font-size:26px;letter-spacing:8px;font-weight:700;text-shadow:0 2px 24px rgba(245,185,66,.35)}
  #boot .b-sub{font-size:11px;letter-spacing:4px;color:#AEB9C9;font-weight:600}
  #boot .b-bar{width:132px;height:3px;border-radius:99px;background:rgba(244,239,234,.14);overflow:hidden}
  #boot .b-bar::after{content:"";display:block;width:44%;height:100%;border-radius:99px;
    background:linear-gradient(90deg,transparent,#F5B942,transparent);animation:b-slide 1.15s ease-in-out infinite}
  @keyframes b-slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  @media (prefers-reduced-motion:reduce){#boot .b-bar::after{animation:none;width:100%}}
</style>
</head>

  <div class="b-bar"></div>
