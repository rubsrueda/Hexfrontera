# Electron Builder · Hexfrontier
# `npm run dist`   → instalador NSIS (x64)
# `npm run steam`  → carpeta desempaquetada para subir el depot de Steam
appId: com.hexfrontier.game
productName: Hexfrontier
copyright: © 2026 Hexfrontier

directories:
  output: dist
  buildResources: build

# Solo el proceso principal y su preload dentro del asar. El juego viaja como
# recurso extra (resources/www) para no parsear 6 MB de artdata en cada arranque.
# node_modules queda fuera: main/preload/saves solo usan módulos nativos.
files:
  - electron/**
  - package.json
  - "!node_modules/**"
  - "!**/*.map"

extraResources:
  - from: www
    to: www
    filter:
      - "**/*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}
  # Steam no necesita installer: `npm run steam` genera dist/win-unpacked

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Hexfrontier

mac:
  target: [dmg]
  category: public.app-category.strategy-games
  icon: build/icon.icns

linux:
  target: [AppImage]
  category: Game
  icon: build/icon.png
